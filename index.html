<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3f6b56" />
    <meta name="description" content="Min dag är en lugn app med tydliga steg för morgon, kväll och natt." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Min dag" />
    <link rel="icon" href="/min-dag/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/min-dag/icons/icon-180.png" />
    <link rel="manifest" href="/min-dag/manifest.webmanifest" />
    <title>Min dag</title>
    <script>
      try {
        var raw = localStorage.getItem("min-dag-v1");
        if (raw) {
          var data = JSON.parse(raw);
          var accents = ["#3f6b56", "#3d4d86", "#55652e", "#1d6874"];
          var soft = ["#e5f0ea", "#e6e8f6", "#eef2df", "#e2f3f5"];
          var bg = ["#f6f1e6", "#eef0f7", "#f5f4ea", "#eef5f5"];
          var i = data.settings && typeof data.settings.theme === "number" ? data.settings.theme : 0;
          if (i < 0 || i > 3) i = 0;
          var root = document.documentElement;
          root.style.setProperty("--accent", accents[i]);
          root.style.setProperty("--accent-soft", soft[i]);
          root.style.setProperty("--bg", bg[i]);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", accents[i]);
        }
      } catch (e) {}
    </script>
    <script type="module" crossorigin src="/min-dag/assets/index-CWOWePDW.js"></script>
    <link rel="stylesheet" crossorigin href="/min-dag/assets/index-CVZ-tcwx.css">
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p class="noscript">Min dag behöver JavaScript. Slå på det i webbläsaren och öppna sidan igen.</p>
    </noscript>
  </body>
</html>
